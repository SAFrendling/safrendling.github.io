<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // Node Not Found</title>
  <!-- Root-relative path ensures CSS loads no matter how deep the broken URL was -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="error-page">

  <main class="error-content">
    
    <!-- Flickering Image Container -->
    <div class="flicker-container">
      <!-- Base Background Image -->
      <img src="/assets/images/404-base.png" alt="404 Error Base">
      
      <!-- Flickering Glitch Overlay Image -->
      <img src="/assets/images/404-glitch.png" alt="404 Error Glitch" class="img-overlay">
    </div>

    <h1>404 // NODE NOT FOUND</h1>
    <p>The requested network endpoint does not exist or has been decommissioned.</p>

    <!-- Direct link back to homepage -->
    <a href="/" class="btn-home">Re-establish Connection</a>

  </main>

</body>
</html>
