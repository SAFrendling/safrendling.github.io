<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // Node Not Found</title>
  <!-- Root-relative path ensures CSS loads no matter how deep the broken URL was -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="error-page">

  <main class="error-container">

    <!-- Flickering Image Container -->
    <div class="flicker-container">
      <!-- Base Background Image -->
      <img src="/assets/images/404.jpg" alt="404 Normal">

      <!-- Flickering Glitch Overlay Image -->
      <img src="/assets/images/404-smash.jpg" alt="404 Smash" class="img-overlay">
    </div>

    <h1>404 // NODE NOT FOUND</h1>
    <p>The requested network endpoint does not exist or has been decommissioned.</p>

    <!-- Action Buttons -->
    <div class="btn-group">
      <a href="/" class="btn-home">Return to safer spaces</a>
      <button id="check-coconut-btn" class="btn-home">Check Coconut Integrity</button>
    </div>

    <!-- Diagnostic Result Display -->
    <div id="coconut-status" class="coconut-status"></div>

  </main>

  <script src="/assets/js/main.js"></script>
</body>
</html>
